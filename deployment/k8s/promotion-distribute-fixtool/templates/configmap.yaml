apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "promotion-distribute-fixtool.fullname" . }}
data:
  appsetting.json: | 
    {  
      "FixTool": {
        "CashBaseUrl": "http://cashservice-api",
        "PlayerServiceBaseUrl": "http://player-api",
        "PlayerBucketBaseUrl": "https://tgs-playerbucket-service"
      }
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
    
    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "tgs"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
        
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]     
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]
    